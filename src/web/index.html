<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herdr Games</title>
</head>
<body>
  <!-- All visible text is game-neutral / empty here; the active format's
       chrome fills the header, panel title, and overlays on the first sync. -->
  <div id="app">
    <section id="track-column">
      <header class="chrome">
        <span id="live-pill"><span class="dot"></span><span id="phase-text"></span></span>
        <span id="lap-text" class="mono"></span>
        <span id="gp-text" class="muted"></span>
        <span id="connection-text" class="mono push-right"></span>
      </header>
      <div id="track-wrap">
        <canvas id="track" aria-hidden="true"></canvas>
        <div id="overlay" hidden></div>
      </div>
    </section>
    <section id="standings-column">
      <header class="chrome">
        <span class="panel-title"></span>
        <span id="car-count" class="mono muted push-right">—</span>
      </header>
      <div id="standings-scroll">
        <div id="standings" role="list" aria-label="Standings"></div>
        <div id="standings-empty"></div>
      </div>
    </section>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
